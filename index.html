<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calisthenics Pro PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    /* Stili Base e Reset */
    :root { --bg: #121212; --card: #1e1e1e; --primary: #bb86fc; --text: #ffffff; --text-muted: #a1a1aa; --danger: #cf6679; --success: #03dac6; }
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; }
    * { box-sizing: border-box; }
    
    /* Layout */
    .header { padding: 20px; text-align: center; background: var(--card); font-size: 20px; font-weight: bold; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; }
    .container { padding: 20px; display: none; } /* Le view sono nascoste di default */
    .container.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Componenti UI */
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h2, h3 { margin-top: 0; color: var(--primary); }
    input, select { width: 100%; padding: 12px; margin: 8px 0 16px; border-radius: 8px; border: 1px solid #444; background: var(--bg); color: var(--text); font-size: 16px; }
    
    .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; color: #121212; }
    .btn-primary { background: var(--primary); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); }
    
    /* Timer Display */
    .timer-display { font-size: 48px; font-variant-numeric: tabular-nums; text-align: center; margin: 20px 0; font-weight: bold; }
    
    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card); border-top: 1px solid #333; display: flex; justify-content: space-around; padding: 10px 0; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { color: var(--text-muted); text-align: center; font-size: 12px; cursor: pointer; flex: 1; padding: 10px; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
    .nav-icon { font-size: 24px; display: block; margin-bottom: 4px; }
    
    /* List item */
    .list-item { padding: 12px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <div class="header">CaliTracker Pro</div>

  <!-- VIEW 1: ALLENAMENTO (Timer e Log) -->
  <div id="view-workout" class="container active">
    <div class="card">
      <h3>Esercizio Attuale</h3>
      <select id="workout-exercise-select"></select>
      
      <div id="timer-display" class="timer-display">00:00</div>
      
      <button id="action-btn" class="btn btn-primary">▶️ Inizia Serie</button>
      <p style="text-align:center; color: var(--text-muted); font-size: 14px; margin-top: 15px;" id="timer-status">Pronto per iniziare</p>
    </div>
  </div>

  <!-- VIEW 2: LIBRERIA (Gestione Esercizi e Categorie) -->
  <div id="view-library" class="container">
    <div class="card">
      <h3>Aggiungi Esercizio</h3>
      <label>Nome Esercizio</label>
      <input type="text" id="new-ex-name" placeholder="es. Muscle Up">
      
      <label>Distretto / Categoria</label>
      <select id="new-ex-cat"></select>
      
      <button id="add-ex-btn" class="btn btn-success">➕ Aggiungi alla Libreria</button>
    </div>

    <div class="card">
      <h3>I Tuoi Esercizi</h3>
      <div id="exercise-list"></div>
    </div>
  </div>

  <!-- VIEW 3: STORICO -->
  <div id="view-history" class="container">
    <div class="card">
      <h3>Ultime Serie</h3>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('workout')">
      <span class="nav-icon">⏱️</span>Workout
    </div>
    <div class="nav-item" onclick="switchTab('library')">
      <span class="nav-icon">📚</span>Libreria
    </div>
    <div class="nav-item" onclick="switchTab('history')">
      <span class="nav-icon">📈</span>Storico
    </div>
  </div>

  <script>
    // --- 1. GESTIONE DATABASE E STATO ---
    const defaultDB = {
      categories: ["Spinta", "Tirata", "Core", "Gambe", "Full Body"],
      exercises: [
        { id: 1, name: "Pull Ups (Trazioni)", category: "Tirata" },
        { id: 2, name: "Push Ups (Piegamenti)", category: "Spinta" },
        { id: 3, name: "Pistol Squat", category: "Gambe" },
        { id: 4, name: "L-Sit", category: "Core" }
      ],
      logs: [] // { date, exercise, reps, execTimeSec, restTimeSec }
    };

    // Inizializza il DB locale
    let db = JSON.parse(localStorage.getItem('cali_db')) || defaultDB;
    const saveDB = () => localStorage.setItem('cali_db', JSON.stringify(db));

    // --- 2. LOGICA DI NAVIGAZIONE A TAB ---
    function switchTab(tabName) {
      document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      
      document.getElementById(`view-${tabName}`).classList.add('active');
      event.currentTarget.classList.add('active');

      if(tabName === 'history') renderHistory();
    }

    // --- 3. POPOLAMENTO UI (Libreria ed Esercizi) ---
    function renderLibrary() {
      const catSelect = document.getElementById('new-ex-cat');
      const workSelect = document.getElementById('workout-exercise-select');
      const exList = document.getElementById('exercise-list');

      catSelect.innerHTML = db.categories.map(c => `<option value="${c}">${c}</option>`).join('');
      workSelect.innerHTML = db.exercises.map(e => `<option value="${e.name}">[${e.category}] ${e.name}</option>`).join('');
      
      exList.innerHTML = db.exercises.map(e => `
        <div class="list-item">
          <span><b>${e.name}</b> <small style="color:var(--text-muted)">(${e.category})</small></span>
        </div>
      `).join('');
    }

    document.getElementById('add-ex-btn').addEventListener('click', () => {
      const name = document.getElementById('new-ex-name').value;
      const cat = document.getElementById('new-ex-cat').value;
      if (!name) return alert("Inserisci un nome!");
      
      db.exercises.push({ id: Date.now(), name, category: cat });
      saveDB();
      document.getElementById('new-ex-name').value = '';
      renderLibrary();
    });

    // --- 4. LOGICA DEL TIMER INTELLIGENTE ---
    let timerState = 'idle'; // 'idle' | 'executing' | 'resting'
    let timerInterval;
    let startTime;
    let execTimeSec = 0;
    const defaultRestSec = 90; // 1 minuto e 30 sec di base per il recupero

    const timerDisplay = document.getElementById('timer-display');
    const actionBtn = document.getElementById('action-btn');
    const timerStatus = document.getElementById('timer-status');

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay(seconds) {
      timerDisplay.innerText = formatTime(seconds);
    }

    actionBtn.addEventListener('click', () => {
      if (timerState === 'idle' || timerState === 'resting') {
        // INIZIA L'ESECUZIONE DELL'ESERCIZIO
        clearInterval(timerInterval);
        timerState = 'executing';
        startTime = Date.now();
        actionBtn.innerText = "⏹️ Fine Esecuzione";
        actionBtn.className = "btn btn-danger";
        timerStatus.innerText = "Tempo Sotto Tensione (Esecuzione)";
        
        timerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - startTime) / 1000);
          updateDisplay(elapsed);
        }, 200);

      } else if (timerState === 'executing') {
        // FINE ESECUZIONE -> CHIEDI LE REPS -> INIZIA RECUPERO
        clearInterval(timerInterval);
        execTimeSec = Math.floor((Date.now() - startTime) / 1000);
        
        // Simula un popup nativo per inserire le ripetizioni
        const reps = prompt("Serie finita! Quante ripetizioni hai fatto?", "10");
        
        if (reps !== null) {
          // Salva nel DB
          db.logs.push({
            date: Date.now(),
            exercise: document.getElementById('workout-exercise-select').value,
            reps: parseInt(reps) || 0,
            execTimeSec: execTimeSec
          });
          saveDB();
        }

        // INIZIA IL RECUPERO AUTOMATICO
        timerState = 'resting';
        actionBtn.innerText = "⏭️ Salta Recupero";
        actionBtn.className = "btn btn-success";
        timerStatus.innerText = "Tempo di Recupero Rimanente";
        let restRemaining = defaultRestSec;
        updateDisplay(restRemaining);
        
        const restStartTime = Date.now();

        timerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - restStartTime) / 1000);
          restRemaining = defaultRestSec - elapsed;
          
          if (restRemaining <= 0) {
            // RECUPERO FINITO!
            clearInterval(timerInterval);
            timerState = 'idle';
            updateDisplay(0);
            actionBtn.innerText = "▶️ Inizia Nuova Serie";
            actionBtn.className = "btn btn-primary";
            timerStatus.innerText = "Recupero Terminato!";
            // Feedback fisico se il dispositivo lo supporta
            if (navigator.vibrate) navigator.vibrate([300, 100, 300]); 
          } else {
            updateDisplay(restRemaining);
          }
        }, 200);
      }
    });

    // --- 5. RENDER STORICO ---
    function renderHistory() {
      const list = document.getElementById('history-list');
      const recentLogs = [...db.logs].reverse().slice(0, 15); // Mostra gli ultimi 15
      
      if(recentLogs.length === 0) {
        list.innerHTML = "<p style='color:var(--text-muted)'>Nessun allenamento registrato.</p>";
        return;
      }

      list.innerHTML = recentLogs.map(log => {
        const d = new Date(log.date);
        const dateStr = `${d.getDate()}/${d.getMonth()+1} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
        return `
          <div class="list-item">
            <div>
              <div style="font-weight:bold; color:var(--success)">${log.reps} Reps</div>
              <div style="font-size: 12px; color:var(--text-muted)">${dateStr}</div>
            </div>
            <div style="text-align:right">
              <div>${log.exercise}</div>
              <div style="font-size: 12px; color:var(--text-muted)">Esecuzione: ${log.execTimeSec}s</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Inizializza l'app all'avvio
    renderLibrary();
    
    // Registrazione Service Worker per il funzionamento Offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
